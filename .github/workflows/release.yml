# Push a vX.Y.Z tag; goreleaser builds, signs and attaches the registry files.
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    if: github.repository_owner == 'c0x12c'
    env:
      HAS_GPG_KEY: ${{ secrets.GPG_PRIVATE_KEY != '' }}
    steps:
      - name: Checkout tag
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The registry shows docs/ from the tag, so its example must name this release line.
      - name: Check docs name this version
        shell: bash
        run: |
          v="${GITHUB_REF_NAME#v}"; want="~> $(echo "$v" | cut -d. -f1,2).0"
          for f in examples/provider/provider.tf docs/index.md README.md; do
            grep -q "version = \"$want\"" "$f" || { echo "::error file=$f::expected version = \"$want\"; run make version VERSION=$v before tagging"; exit 1; }
          done

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # Signing is only required by the public Terraform Registry; without a key the release is unsigned.
      - name: Import GPG key
        if: env.HAS_GPG_KEY == 'true'
        id: import-gpg
        uses: crazy-max/ghaction-import-gpg@v7
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}

      - name: Build, sign and release
        uses: goreleaser/goreleaser-action@v7
        with:
          version: '~> v2'
          args: release --clean ${{ env.HAS_GPG_KEY != 'true' && '--skip=sign' || '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPG_FINGERPRINT: ${{ steps.import-gpg.outputs.fingerprint }}
